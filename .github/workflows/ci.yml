name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # explicit file list — Node 20 has no glob support in `node --test`
      - run: node scripts/run-tests.mjs
      # nothing company-specific outside config/
      - run: node scripts/hardcode-lint.mjs
      # settings.json hooks wired, marketplace pinned, agent frontmatter valid
      - run: node scripts/repo-checks.mjs
      # CI runners are slower than laptops (local default budget is 1500 ms)
      - run: node scripts/hooks-latency.mjs
        env:
          SFSMITHS_HOOK_BUDGET_MS: "3000"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
