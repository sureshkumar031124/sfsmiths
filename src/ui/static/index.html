<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SFsmiths</title>
<style>
  :root{
    --bg:#0f1218;--panel:#161b24;--panel2:#1d2430;--line:#283142;--text:#e6e9ef;--muted:#9aa4b5;--accent:#4f8cff;--accent2:#7fb2ff;
    --ok:#3ecf8e;--warn:#f5b84b;--bad:#ff6b6b;--info:#8f7bff;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f4f6fa;--panel:#ffffff;--panel2:#f0f3f8;--line:#d9dfea;--text:#141a24;--muted:#5b6678;--accent:#2a6df4;--accent2:#1d4fb8}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
  a{color:var(--accent)}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;margin:0 6px 18px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--info));display:grid;place-items:center;font-weight:800;color:#fff;font-family:var(--mono)}
  .brand b{font-size:17px;letter-spacing:.2px}
  .brand small{display:block;color:var(--muted);font-size:11px}
  nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:var(--text);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;text-align:left}
  nav button:hover{background:var(--panel2)}
  nav button.active{background:var(--accent);color:#fff}
  nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
  nav .foot{position:absolute;bottom:14px;left:14px;right:14px;color:var(--muted);font-size:11px;line-height:1.5}
  main{padding:26px 30px 60px;max-width:1400px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin-bottom:20px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
  @media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .kpi{font-size:28px;font-weight:700}
  .kpi small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--muted);text-align:left;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
  .pill.running{color:var(--accent);border-color:var(--accent)}
  .pill.waiting_human,.pill.MEDIUM,.pill.warn{color:var(--warn);border-color:var(--warn)}
  .pill.done,.pill.passed,.pill.LOW,.pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.failed,.pill.escalated,.pill.HIGH,.pill.fail,.pill.bad{color:var(--bad);border-color:var(--bad)}
  .pill.on_hold,.pill.parked,.pill.skipped,.pill.unavailable,.pill.skip{color:var(--muted)}
  .pill.pending{color:var(--info);border-color:var(--info)}
  .mono{font-family:var(--mono);font-size:12px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .right{margin-left:auto}
  button.btn,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  button.btn{cursor:pointer}button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.btn.danger{color:var(--bad);border-color:var(--bad)}
  button.btn.ok{color:var(--ok);border-color:var(--ok)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  textarea{width:100%;min-height:420px;font-family:var(--mono);font-size:12px;line-height:1.5;tab-size:2}
  .bar{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar i.over{background:var(--bad)}
  .toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;max-width:480px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;z-index:50;white-space:pre-wrap}
  .toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
  .banner{background:rgba(255,107,107,.12);border:1px solid var(--bad);color:var(--text);border-radius:10px;padding:10px 14px;margin-bottom:16px}
  .ladder{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
  .step{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;min-width:96px;background:var(--panel2)}
  .step b{display:block;font-size:12px}.step small{color:var(--muted)}
  .step.done{border-color:var(--ok)}.step.running{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,140,255,.25)}.step.failed{border-color:var(--bad)}.step.skipped{opacity:.5}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:520px;white-space:pre-wrap}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,92vw)}
  .modal h2{margin:0 0 6px;font-size:17px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .sparks{display:flex;gap:4px;align-items:flex-end;height:60px}
  .sparks i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-width:6px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer}
  .tabs button.on{border-color:var(--accent);color:var(--accent)}
  details summary{cursor:pointer;color:var(--muted)}
  .empty{color:var(--muted);padding:20px;text-align:center}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
  .dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand"><div class="logo">SF</div><div><b>SFsmiths</b><small>local control room</small></div></div>
    <button data-v="dashboard">⌂ Dashboard <span class="badge" id="badge-needs" hidden></span></button>
    <button data-v="tickets">▤ Tickets</button>
    <button data-v="agents">✦ Agents &amp; models</button>
    <button data-v="orgs">☁ Orgs</button>
    <button data-v="safety">⛨ Safety</button>
    <button data-v="lessons">★ Lessons &amp; rewards</button>
    <button data-v="config">⚙ Config &amp; doctor</button>
    <div class="foot">127.0.0.1 only · token-protected · this UI edits config and records decisions; it never runs agents or touches Salesforce data.<br><span id="foot-ts"></span></div>
  </nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
(() => {
  'use strict';
  /* ───────── token + routing (token lives in the URL fragment; never sent as a query string) ───────── */
  const hashParams = () => new URLSearchParams(location.hash.replace(/^#/, ''));
  let TOKEN = hashParams().get('t') || '';
  const setHash = (v, extra = {}) => { const h = new URLSearchParams({ t: TOKEN, v, ...extra }); location.hash = h.toString(); };
  const view = () => hashParams().get('v') || 'dashboard';
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => n == null ? '–' : Number(n).toLocaleString();
  const usd = (n) => n == null ? '–' : '$' + Number(n).toFixed(2);
  const ago = (iso) => { if (!iso) return '–'; const s = (Date.now() - Date.parse(iso)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; };
  const pill = (v) => `<span class="pill ${esc(v)}">${esc(v)}</span>`;

  async function api(method, path, body) {
    const r = await fetch('/api/' + path, { method, headers: { 'X-SFsmiths-Token': TOKEN, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({ error: 'bad JSON from server' }));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  }
  let toastT; function toast(msg, kind = '') { const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + kind; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = 'none'), kind === 'bad' ? 9000 : 5000); }
  function modal(html) { $('#modal-box').innerHTML = html; $('#modal').style.display = 'grid'; }
  function closeModal() { $('#modal').style.display = 'none'; }
  $('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) closeModal(); });

  const main = $('#main');
  const setMain = (html) => { main.innerHTML = html; };
  const fail = (e) => setMain(`<div class="banner">${esc(e.message || e)}</div>`);

  /* ───────── DASHBOARD ───────── */
  async function renderDashboard() {
    const d = await api('GET', 'dashboard');
    const c = d.counts;
    const cfgErr = Object.entries(d.config_errors || {});
    const budgetPct = d.today.budget_usd ? Math.min(100, (d.today.usd / d.today.budget_usd) * 100) : 0;
    const rewardRows = Object.entries(d.rewards.by_agent || {}).sort((a, b) => b[1] - a[1]);
    const maxR = Math.max(1, ...rewardRows.map(([, v]) => Math.abs(v)));
    $('#badge-needs').hidden = !d.needs_you.length; $('#badge-needs').textContent = d.needs_you.length;
    setMain(`
      <h1>Dashboard</h1><div class="sub">Generated ${esc(ago(d.generated_at))} · reads work/, metrics/, knowledge/ — nothing here runs an agent.</div>
      ${cfgErr.length ? `<div class="banner"><b>Config problems</b> — fix in Config tab:<br>${cfgErr.map(([k, v]) => `<span class="mono">${esc(k)}</span>: ${esc(v.split('\n')[0])}`).join('<br>')}</div>` : ''}
      <div class="grid g4">
        <div class="card"><h3>Needs you</h3><div class="kpi">${c.waiting_human + c.escalated + c.parked}<small>waiting ${c.waiting_human} · escalated ${c.escalated} · parked ${c.parked}</small></div></div>
        <div class="card"><h3>Running</h3><div class="kpi">${c.running}<small>of ${c.tickets} tickets · ${c.done} done · ${c.failed} failed · ${c.on_hold} on hold</small></div></div>
        <div class="card"><h3>Today</h3><div class="kpi">${fmt(d.today.tokens)}<small>tokens · ${d.today.runs} agent runs</small></div>
          <div class="muted" style="margin-top:4px">${usd(d.today.usd)} ${d.today.budget_usd ? 'of ' + usd(d.today.budget_usd) + ' daily budget' : '(no daily USD budget set)'}${d.today.prices_source === 'none' ? ' · <b>no price table</b> → cost shows $0 (config/budgets.yaml → prices)' : ' · prices from ' + esc(d.today.prices_source || '')}</div>
          <div class="bar"><i class="${budgetPct >= 100 ? 'over' : ''}" style="width:${budgetPct}%"></i></div></div>
        <div class="card"><h3>Safety</h3><div class="kpi">${d.denials_last_7d}<small>denials in 7 days</small></div>
          <div class="muted" style="margin-top:4px">${Object.entries(d.canary || {}).map(([a, s]) => `<span class="dot ${s.result === 'pass' ? (s.fresh ? 'ok' : 'warn') : s.result === 'never' ? 'warn' : 'bad'}"></span>canary ${esc(a)}: ${esc(s.result || 'unknown')}${s.at ? ' · ' + esc(ago(s.at)) : ''}${s.result === 'pass' && !s.fresh ? ' (stale — agents re-run it before creating data)' : ''}`).join('<br>') || 'no development org configured'}</div></div>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h3>Needs a decision</h3>${d.needs_you.length ? `<table><tr><th>Ticket</th><th>Status</th><th>Stage</th><th>Waiting for</th><th></th></tr>${d.needs_you.map((t) => `
          <tr class="click" data-t="${esc(t.ticket)}"><td class="mono">${esc(t.ticket)}<div class="muted">${esc(t.title)}</div></td><td>${pill(t.status)} ${pill(t.tier)}</td><td class="mono">${esc(t.stage)}</td>
          <td>${t.waiting ? `<b>${esc(t.waiting.kind)}</b> — ${esc(t.waiting.prompt)}<div class="muted">${esc(ago(t.waiting.since))}</div>` : '<span class="muted">—</span>'}</td>
          <td class="row">${t.waiting && t.waiting.kind === 'approval' ? `<button class="btn ok" data-approve="${esc(t.ticket)}" data-stage="${esc(t.waiting.stage)}" data-tier="${esc(t.tier)}">Approve</button><button class="btn danger" data-reject="${esc(t.ticket)}" data-stage="${esc(t.waiting.stage)}">Reject</button>` : ''}</td></tr>`).join('')}</table>` : '<div class="empty">Nothing waiting on you. 🎉</div>'}</div>
        <div class="card"><h3>Reward ledger (net points by agent)</h3>${rewardRows.length ? rewardRows.map(([a, v]) => `<div class="row" style="margin:4px 0"><span class="mono" style="width:150px">${esc(a)}</span><div class="bar" style="flex:1;margin:0"><i class="${v < 0 ? 'over' : ''}" style="width:${Math.abs(v) / maxR * 100}%"></i></div><span style="width:60px;text-align:right">${v > 0 ? '+' : ''}${v}</span></div>`).join('') : '<div class="empty">No rewards yet — they appear after the first ticket run.</div>'}
          <div class="muted" style="margin-top:8px">Lessons: ${d.lessons.pending} pending review · ${d.lessons.active} active</div></div>
      </div>
      <div class="card" style="margin-top:14px"><h3>Recent tickets</h3>${d.recent.length ? `<table><tr><th>Ticket</th><th>Status</th><th>Tier</th><th>Stage</th><th>Progress</th><th>Tokens</th><th>Updated</th></tr>${d.recent.map((t) => `
        <tr class="click" data-t="${esc(t.ticket)}"><td class="mono">${esc(t.ticket)}<div class="muted">${esc(t.title)}</div></td><td>${pill(t.status)}</td><td>${pill(t.tier)}</td><td class="mono">${esc(t.stage)}</td><td>${t.stages_done}/${t.stages_total}<div class="bar" style="width:120px"><i style="width:${t.stages_done / t.stages_total * 100}%"></i></div></td><td>${fmt(t.tokens)}</td><td class="muted">${esc(ago(t.updated_at))}</td></tr>`).join('')}</table>` : '<div class="empty">No tickets yet. In Claude Code: <span class="mono">/ticket YOUR-123</span></div>'}</div>`);
    main.querySelectorAll('tr.click').forEach((tr) => tr.addEventListener('click', (e) => { if (e.target.closest('button')) return; setHash('tickets', { id: tr.dataset.t }); }));
    wireDecisionButtons();
  }

  function wireDecisionButtons() {
    main.querySelectorAll('[data-approve]').forEach((b) => b.addEventListener('click', () => approveDialog(b.dataset.approve, b.dataset.stage, b.dataset.tier)));
    main.querySelectorAll('[data-reject]').forEach((b) => b.addEventListener('click', () => rejectDialog(b.dataset.reject, b.dataset.stage)));
    main.querySelectorAll('[data-hold]').forEach((b) => b.addEventListener('click', () => holdDialog(b.dataset.hold)));
  }
  function approveDialog(ticket, stage, tier) {
    const needsAnswer = tier === 'HIGH' && stage === 'plan';
    modal(`<h2>Approve ${esc(ticket)} · ${esc(stage)}</h2><div class="muted">Recorded as an approval file in the ticket vault. The conductor continues on the next <span class="mono">sfsmiths agent handoff</span>.</div>
      <label>${needsAnswer ? 'What did you check? (required for HIGH-tier plans, ≥ 8 chars)' : 'Note (optional)'}</label><input id="m-answer" style="width:100%" placeholder="${needsAnswer ? 'e.g. checked the field list against the Account object and the rollback note' : ''}">
      <label>Edits to apply first (optional — becomes approved_with_edits)</label><textarea id="m-edits" style="min-height:90px" placeholder="Leave empty to approve as-is"></textarea>
      <div class="row" style="margin-top:14px"><button class="btn right" id="m-cancel">Cancel</button><button class="btn primary" id="m-ok">Approve</button></div>`);
    $('#m-cancel').onclick = closeModal;
    $('#m-ok').onclick = async () => { try { const r = await api('POST', `tickets/${ticket}/approve`, { stage, answer: $('#m-answer').value, edits: $('#m-edits').value }); closeModal(); toast(`Approved ${ticket} (${stage}). ${r.next}`, 'ok'); render(); } catch (e) { toast(e.message, 'bad'); } };
  }
  function rejectDialog(ticket, stage) {
    modal(`<h2>Reject ${esc(ticket)} · ${esc(stage)}</h2><div class="muted">The stage is re-run with your reason; the reason also becomes a lesson candidate.</div>
      <label>Reason (required)</label><textarea id="m-reason" style="min-height:110px"></textarea>
      <div class="row" style="margin-top:14px"><button class="btn right" id="m-cancel">Cancel</button><button class="btn danger" id="m-ok">Reject</button></div>`);
    $('#m-cancel').onclick = closeModal;
    $('#m-ok').onclick = async () => { try { await api('POST', `tickets/${ticket}/reject`, { stage, reason: $('#m-reason').value }); closeModal(); toast(`Rejected ${ticket} (${stage})`, 'ok'); render(); } catch (e) { toast(e.message, 'bad'); } };
  }
  function holdDialog(ticket) {
    modal(`<h2>Put ${esc(ticket)} on hold</h2><div class="muted">Locks are released; resume later with <span class="mono">/resume ${esc(ticket)}</span> (the tracker is re-checked for changes first).</div>
      <label>Reason</label><input id="m-reason" style="width:100%" placeholder="waiting for the reporter to confirm the expected behaviour">
      <div class="row" style="margin-top:14px"><button class="btn right" id="m-cancel">Cancel</button><button class="btn primary" id="m-ok">Hold</button></div>`);
    $('#m-cancel').onclick = closeModal;
    $('#m-ok').onclick = async () => { try { await api('POST', `tickets/${ticket}/hold`, { reason: $('#m-reason').value }); closeModal(); toast(`${ticket} on hold`, 'ok'); render(); } catch (e) { toast(e.message, 'bad'); } };
  }

  /* ───────── TICKETS ───────── */
  async function renderTickets() {
    const id = hashParams().get('id');
    if (id) return renderTicket(id);
    const rows = await api('GET', 'tickets');
    const filter = hashParams().get('f') || 'all';
    const shown = rows.filter((r) => filter === 'all' || r.status === filter).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
    const statuses = ['all', 'running', 'waiting_human', 'on_hold', 'escalated', 'parked', 'done', 'failed'];
    setMain(`<h1>Tickets</h1><div class="sub">One folder per ticket under <span class="mono">work/&lt;KEY&gt;/</span>. Click a row for the stage ladder, gates, evidence files and decisions.</div>
      <div class="tabs">${statuses.map((s) => `<button class="${s === filter ? 'on' : ''}" data-f="${s}">${s.replace('_', ' ')} <span class="muted">${s === 'all' ? rows.length : rows.filter((r) => r.status === s).length}</span></button>`).join('')}</div>
      <div class="card">${shown.length ? `<table><tr><th>Ticket</th><th>Status</th><th>Tier</th><th>Stage</th><th>Progress</th><th>Bounces</th><th>Tokens</th><th>Cost</th><th>Updated</th></tr>${shown.map((t) => `
        <tr class="click" data-t="${esc(t.ticket)}"><td class="mono">${esc(t.ticket)}<div class="muted">${esc(t.title)}</div></td><td>${pill(t.status)}</td><td>${pill(t.tier)}</td><td class="mono">${esc(t.stage)}</td><td>${t.stages_done}/${t.stages_total}</td><td>${t.bounces}</td><td>${fmt(t.tokens)}</td><td>${usd(t.usd)}</td><td class="muted">${esc(ago(t.updated_at))}</td></tr>`).join('')}</table>` : '<div class="empty">No tickets match.</div>'}</div>`);
    main.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setHash('tickets', { f: b.dataset.f })));
    main.querySelectorAll('tr.click').forEach((tr) => tr.addEventListener('click', () => setHash('tickets', { id: tr.dataset.t })));
  }

  async function renderTicket(id) {
    const d = await api('GET', `tickets/${encodeURIComponent(id)}`);
    const m = d.manifest;
    const stageOf = (s) => m.stages[s.id] || { status: 'pending', attempts: 0 };
    const gatesFor = (sid) => (m.gates[sid] || []);
    const latest = (sid) => { const out = {}; for (const g of gatesFor(sid)) out[g.name] = g; return Object.values(out); };
    const tokRows = Object.entries(d.tokens_by_agent || {}).sort((a, b) => b[1].tokens - a[1].tokens);
    setMain(`
      <div class="row"><a href="#" id="back">← all tickets</a></div>
      <h1><span class="mono">${esc(m.ticket)}</span> ${esc(m.title || '')}</h1>
      <div class="sub row">${pill(m.status)} ${pill(m.tier)} <span class="muted">tier by ${esc(m.tier_source || '–')}</span> · stage <span class="mono">${esc(m.stage)}</span> · ${fmt(m.budget.tokens)} tokens · ${usd(m.budget.usd)} · created ${esc(ago(m.created_at))} · updated ${esc(ago(m.updated_at))}
        <span class="right row">${m.status !== 'on_hold' && m.status !== 'done' ? `<button class="btn" data-hold="${esc(m.ticket)}">Hold</button>` : ''}</span></div>
      ${m.waiting ? `<div class="card" style="border-color:var(--warn)"><h3>Waiting on you · ${esc(m.waiting.kind)} · stage ${esc(m.waiting.stage)}</h3><div>${esc(m.waiting.prompt)}</div><div class="muted">since ${esc(ago(m.waiting.since))}</div>
        <div class="row" style="margin-top:10px">${m.waiting.kind === 'approval' ? `<button class="btn ok" data-approve="${esc(m.ticket)}" data-stage="${esc(m.waiting.stage)}" data-tier="${esc(m.tier)}">Approve</button><button class="btn danger" data-reject="${esc(m.ticket)}" data-stage="${esc(m.waiting.stage)}">Reject</button>` : `<span class="muted">This kind of wait is resolved from the terminal: <span class="mono">${esc(m.waiting.kind === 'deploy' ? 'sfsmiths-human deployed ' + m.ticket + ' --org preprod|production' : m.waiting.kind === 'baseline' ? 'sfsmiths-human baseline decide ' + m.ticket : m.waiting.kind === 'question' ? 'answer in the Claude Code session' : 'sfsmiths-human resume ' + m.ticket)}</span></span>`}</div></div>` : ''}
      ${m.escalation ? `<div class="banner"><b>Escalated at ${esc(m.escalation.stage)}</b> · ${esc(m.escalation.reason)}</div>` : ''}
      <div class="card" style="margin-top:14px"><h3>Stage ladder</h3><div class="ladder">${d.stage_defs.map((s) => { const st = stageOf(s); return `<div class="step ${esc(st.status)}" title="${esc(s.kind)} · ${esc(s.agent || 'human')}"><b>${esc(s.id)}</b><small>${esc(s.agent || s.kind)}${st.attempts > 1 ? ' · try ' + st.attempts : ''}${s.human_gate ? ' · gate' : ''}</small></div>`; }).join('')}</div>
        <div class="muted">Allowed next agents: <span class="mono">${esc((m.next_allowed_stages || []).join(', ') || '—')}</span> · bounces ${m.bounces.length} · resumes ${m.resumes.length}${m.locks.length ? ' · locks ' + esc(m.locks.join(', ')) : ''}</div></div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h3>Gates (latest result per gate)</h3>${d.stage_defs.filter((s) => gatesFor(s.id).length).map((s) => `<div style="margin-bottom:8px"><b class="mono">${esc(s.id)}</b> ${latest(s.id).map((g) => `<span class="pill ${esc(g.status)}" title="${esc(g.reason || '')}">${esc(g.name)}</span>`).join(' ')}${latest(s.id).filter((g) => g.status !== 'passed').map((g) => `<div class="muted" style="margin-left:8px">↳ ${esc(g.name)}: ${esc((g.reason || '').slice(0, 220))}</div>`).join('')}</div>`).join('') || '<div class="empty">No gate results yet.</div>'}</div>
        <div class="card"><h3>Tokens by agent</h3>${tokRows.length ? `<table><tr><th>Agent</th><th>Runs</th><th title="input + output + cache writes — what the per-ticket budget is judged on (D-094)">Fresh</th><th title="includes cache re-reads of the same context">Total</th><th>Cost</th></tr>${tokRows.map(([a, v]) => `<tr><td class="mono">${esc(a)}</td><td>${v.runs}</td><td><b>${fmt(v.fresh)}</b></td><td class="muted">${fmt(v.tokens)}</td><td>${usd(v.usd)}</td></tr>`).join('')}</table><div class="muted" style="margin-top:4px">Budget: fresh ${fmt(m.budget.fresh_tokens ?? 0)} of the per-ticket cap · total incl. cache reads ${fmt(m.budget.tokens)}</div>` : '<div class="empty">No agent runs recorded yet.</div>'}
          <h3 style="margin-top:14px">Approvals</h3>${m.approvals.length ? m.approvals.map((a) => `<div>${pill(a.decision)} <span class="mono">${esc(a.stage)}</span> by ${esc(a.by)} via ${esc(a.origin)} · ${esc(ago(a.at))}${a.answer ? `<div class="muted">“${esc(a.answer)}”</div>` : ''}${a.reason ? `<div class="muted">reason: ${esc(a.reason)}</div>` : ''}</div>`).join('') : '<div class="muted">none yet</div>'}
          ${m.baseline ? `<h3 style="margin-top:14px">Baseline</h3><div class="muted">synced ${esc(ago(m.baseline.synced_at))} · ancestor via ${esc(m.baseline.ancestor_source || '?')} · ${m.baseline.decisions.length} decision(s)</div>` : ''}</div>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h3>Vault files</h3><div class="row">${d.files.map((f) => `<button class="btn mono" data-file="${esc(f)}">${esc(f)}</button>`).join('') || '<span class="muted">empty</span>'}</div><pre id="file-view" hidden></pre></div>
        <div class="card"><h3>Recent events</h3><pre>${esc(d.events_tail.map((e) => `${e.ts.slice(11, 19)} ${e.type}${e.stage ? ' @' + e.stage : ''}${e.agent ? ' ' + e.agent : ''}${e.data ? ' ' + JSON.stringify(e.data).slice(0, 140) : ''}`).join('\n') || 'no events')}</pre></div>
      </div>`);
    $('#back').onclick = (e) => { e.preventDefault(); setHash('tickets'); };
    main.querySelectorAll('[data-file]').forEach((b) => b.addEventListener('click', async () => { try { const r = await api('GET', `tickets/${encodeURIComponent(id)}/file?name=${encodeURIComponent(b.dataset.file)}`); const pre = $('#file-view'); pre.hidden = false; pre.textContent = `— ${r.name} —\n${r.content}`; } catch (e) { toast(e.message, 'bad'); } }));
    wireDecisionButtons();
  }

  /* ───────── AGENTS ───────── */
  async function renderAgents() {
    const d = await api('GET', 'agents');
    if (!d.models_config || !d.autonomy_config) return setMain(`<h1>Agents</h1><div class="banner">config/models.yaml or config/autonomy.yaml is missing/invalid — fix it in the Config tab first.</div>`);
    const tiers = d.autonomy_config.tiers; const gateNames = ['intake', 'plan', 'review'];
    setMain(`<h1>Agents &amp; models</h1><div class="sub">Per-agent model, <b>reasoning effort</b> and ask/auto gate mode. Saving writes <span class="mono">config/models.yaml</span> / <span class="mono">config/autonomy.yaml</span> and rewrites the <span class="mono">model:</span> and <span class="mono">effort:</span> lines in <span class="mono">.claude/agents/*.md</span>. New values apply in the <b>next</b> Claude Code session.</div>
      ${d.effort_env_override ? `<div class="banner">CLAUDE_CODE_EFFORT_LEVEL=<b>${esc(d.effort_env_override)}</b> is set in this environment. That environment variable <b>overrides every effort value below</b> — unset it (remove it from your shell profile) for these to take effect.</div>` : ''}
      <div class="card"><table><tr><th>Agent</th><th>Model</th><th>Effort</th><th>Gate mode</th><th>Runs</th><th>Fresh tokens</th><th>Cache reads</th><th>Cost</th><th>Reward</th><th>Files</th></tr>
        ${d.agents.map((a) => `<tr><td class="mono">${esc(a.name)}</td>
          <td><select data-model="${esc(a.name)}">${d.model_choices.map((m) => `<option ${m === a.model ? 'selected' : ''}>${esc(m)}</option>`).join('')}${d.model_choices.includes(a.model) ? '' : `<option selected>${esc(a.model)}</option>`}</select>${a.in_sync ? '' : ` <span class="pill warn" title="agent file: model=${esc(a.model_in_agent_file)} effort=${esc(a.effort_in_agent_file || 'none')}">out of sync</span>`}</td>
          <td><select data-effort="${esc(a.name)}">${d.effort_choices.map((e) => `<option ${e === a.effort ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></td>
          <td><select data-gate="${esc(a.name)}" ${a.hard_floor ? 'disabled title="hard floor: always ask"' : ''}>${['inherit', 'ask', 'auto'].map((g) => `<option ${g === a.gate_mode ? 'selected' : ''}>${g}</option>`).join('')}</select>${a.hard_floor ? ' <span class="pill HIGH">hard floor</span>' : ''}</td>
          <td>${a.runs}</td><td title="input + output + cache writes — what the token budget is judged on">${fmt(a.fresh_tokens)}</td><td class="muted" title="context re-read on each round trip; ~10% of the input price, excluded from the budget">${fmt(a.cache_read_tokens)}</td><td>${usd(a.usd)}</td>
          <td>${a.reward > 0 ? '+' : ''}${a.reward}</td><td>${a.agent_file_exists ? '<span class="dot ok"></span>agent' : '<span class="dot bad"></span>no agent file'}${a.lessons_skill ? ' · <span class="dot ok"></span>lessons' : ''}</td></tr>`).join('')}
        </table>
        <div class="row" style="margin-top:12px"><label style="margin:0">Fallback model</label><select id="fallback">${d.model_choices.filter((m) => m !== 'inherit').map((m) => `<option ${m === d.models_config.fallback ? 'selected' : ''}>${m}</option>`).join('')}</select>
          <label style="margin:0 0 0 14px">Fallback effort</label><select id="fallback-effort">${d.effort_choices.map((e) => `<option ${e === (d.models_config.fallback_effort || 'inherit') ? 'selected' : ''}>${e}</option>`).join('')}</select>
          <button class="btn primary right" id="save-agents">Save models + gate modes</button></div></div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h3>Tier matrix (who must approve, per risk tier)</h3><table><tr><th>Tier</th>${gateNames.map((g) => `<th>${g}</th>`).join('')}</tr>
          ${['LOW', 'MEDIUM', 'HIGH'].map((t) => `<tr><td>${pill(t)}</td>${gateNames.map((g) => `<td><select data-tier="${t}" data-gate="${g}">${['ask', 'auto'].map((v) => `<option ${(tiers[t] && tiers[t].human_gates[g]) === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</table>
          <div class="muted" style="margin-top:8px">Per-agent “ask” above overrides “auto” here (never the other way). Deploy to UAT/production is always human — not configurable.</div>
          <div class="muted">Hard floor (always ask): <span class="mono">${esc((d.autonomy_config.hard_floor || []).join(', ') || 'none')}</span></div></div>
        <div class="card"><h3>Budgets</h3>
          <label>Per ticket · tokens</label><input id="b-tokens" type="number" value="${d.budgets.per_ticket.tokens}">
          <label>Per ticket · USD</label><input id="b-usd" type="number" step="0.5" value="${d.budgets.per_ticket.usd}">
          <label>Per ticket · wall minutes</label><input id="b-wall" type="number" value="${d.budgets.per_ticket.wall_minutes}">
          <label>Daily USD (all tickets)</label><input id="b-daily" type="number" step="1" value="${d.budgets.daily_usd}">
          <label>Pipeline mode max USD per ticket</label><input id="b-pipe" type="number" step="1" value="${d.budgets.pipeline_max_budget_usd}">
          <div class="muted" style="margin-top:8px">On exceed: <b>park</b> (ticket stops, you decide). <b>Per ticket · tokens</b> is judged on <b>fresh</b> tokens (input + output + cache writes); cache reads are shown separately and never counted. Prices come from <span class="mono">config/budgets.yaml &rarr; prices</span> (or <span class="mono">metrics/prices.json</span>) — review them against your own plan.</div>
          <div class="row" style="margin-top:10px"><button class="btn primary right" id="save-budgets">Save budgets</button></div></div>
      </div>`);
    $('#save-agents').onclick = async () => {
      const models = { ...d.models_config, agents: { ...d.models_config.agents }, effort: { ...(d.models_config.effort || {}) }, fallback: $('#fallback').value, fallback_effort: $('#fallback-effort').value };
      main.querySelectorAll('[data-model]').forEach((s) => (models.agents[s.dataset.model] = s.value));
      main.querySelectorAll('[data-effort]').forEach((s) => (models.effort[s.dataset.effort] = s.value));
      const autonomy = JSON.parse(JSON.stringify(d.autonomy_config));
      main.querySelectorAll('select[data-gate][data-tier]').forEach((s) => { autonomy.tiers[s.dataset.tier].human_gates[s.dataset.gate] = s.value; });
      main.querySelectorAll('select[data-gate]:not([data-tier])').forEach((s) => (autonomy.agents[s.dataset.gate] = s.value));
      try { const r1 = await api('PUT', 'config/models', { value: models }); const r2 = await api('PUT', 'config/autonomy', { value: autonomy }); toast(`Saved. Agents updated: ${(r1.sync.agents_updated || []).join(', ') || 'none changed'}. ${[...(r1.sync.warnings || []), ...(r2.sync.warnings || [])].join(' ')}`, 'ok'); render(); } catch (e) { toast(e.message, 'bad'); }
    };
    $('#save-budgets').onclick = async () => {
      const v = { ...d.budgets, per_ticket: { tokens: +$('#b-tokens').value, usd: +$('#b-usd').value, wall_minutes: +$('#b-wall').value }, daily_usd: +$('#b-daily').value, pipeline_max_budget_usd: +$('#b-pipe').value };
      try { await api('PUT', 'config/budgets', { value: v }); toast('Budgets saved', 'ok'); } catch (e) { toast(e.message, 'bad'); }
    };
  }

  /* ───────── SAFETY (D-102) ───────── */
  let safetyDraft = null; // the list being edited before Save (per view load)
  async function renderSafety() {
    const d = await api('GET', 'safety');
    if (!safetyDraft || safetyDraft.source !== d.source) safetyDraft = { source: d.source, emails: [...d.allowed_test_emails], mode: d.email_delivery, census: [...d.email_census_fields] };
    const s = safetyDraft;
    const canaryRows = Object.entries(d.canary || {});
    setMain(`<h1>Safety — e-mail containment</h1><div class="sub">Hard rule: <b>no e-mail ever reaches anyone outside this list</b>. Agents create their own test records with these addresses only; every file they touch is scanned; the canary proves the sandbox's delivery setting before any data is created. Saving writes <span class="mono">config/safety.yaml</span> (${esc(d.source === 'personal' ? 'your copy' : 'currently the shipped default — your copy will be created')}).</div>
      ${d.error ? `<div class="banner">config/safety.yaml is invalid: ${esc(d.error.split('\n')[0])} — fix it in the Config tab first.</div>` : ''}
      <div class="grid g2">
        <div class="card"><h3>Allowed test e-mail addresses (${s.emails.length})</h3>
          <div class="muted">An exact address (<span class="mono">qa.inbox@example.com</span>) or a pattern (<span class="mono">*@example.com</span>, <span class="mono">*.invalid</span>). Salesforce sandboxes append <span class="mono">.invalid</span> to user e-mails on refresh — keep that pattern.</div>
          <div id="sf-emails" style="margin:10px 0">${s.emails.map((e, i) => `<div class="row" style="margin:4px 0"><span class="mono" style="flex:1">${esc(e)}</span><button class="btn danger" data-rm="${i}" title="remove">✕</button></div>`).join('') || '<div class="empty">empty — the allowlist must have at least one entry</div>'}</div>
          <div class="row"><input id="sf-new" placeholder="name@example.com or *@example.com" style="flex:1"><button class="btn" id="sf-add">Add</button></div>
          <h3 style="margin-top:16px">What enforces it</h3><ul class="muted" style="margin:6px 0 0 18px;padding:0">${d.enforcement.map((x) => `<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ul></div>
        <div class="card"><h3>Delivery mode</h3>
          <label style="display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px;color:var(--text)"><input type="radio" name="sf-mode" value="blocked" ${s.mode === 'blocked' ? 'checked' : ''} style="margin-top:3px"><span><b>blocked</b> (default) — the canary must prove the sandbox <i>refuses</i> to send (Deliverability = System email only / No access). Safe whatever records the sandbox holds. Use for Partial/Full Copy sandboxes that contain real customers.</span></label>
          <label style="display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px;color:var(--text)"><input type="radio" name="sf-mode" value="allowlist_only" ${s.mode === 'allowlist_only' ? 'checked' : ''} style="margin-top:3px"><span><b>allowlist_only</b> — delivery may be ON because some tests need a real mail to arrive. The canary then also runs an <b>e-mail census</b>: every address in the fields below must match the list above, otherwise the canary FAILS and every data step is refused. Use only for a sandbox whose records your team created.</span></label>
          <label>Census fields (Object.Field, one per line) — checked in allowlist_only mode</label>
          <textarea id="sf-census" spellcheck="false" style="min-height:90px">${esc(s.census.join('\n'))}</textarea>
          <div class="row" style="margin-top:12px"><button class="btn primary" id="sf-save">Save safety settings</button><span class="muted">canary max age ${d.canary_max_age_minutes} min · tag field <span class="mono">${esc(d.test_tag_field || '')}</span> · canary recipient from <span class="mono">${esc(d.canary_recipient_env || '')}</span></span></div></div>
      </div>
      <div class="card" style="margin-top:14px"><h3>Last canary per development org</h3>
        ${canaryRows.length ? canaryRows.map(([alias, c]) => `<div style="margin:8px 0"><span class="dot ${c.result === 'pass' ? (c.fresh ? 'ok' : 'warn') : c.result === 'never' ? 'warn' : 'bad'}"></span><b class="mono">${esc(alias)}</b> · ${esc(c.result)}${c.at ? ' · ' + esc(ago(c.at)) : ''}${c.result === 'pass' && !c.fresh ? ' · <b>stale</b> — data steps will be refused until you rerun' : ''} · mode <span class="mono">${esc(c.mode || 'blocked')}</span><div class="muted" style="margin-left:18px">${esc(c.detail || c.note || '')}</div>
          ${c.census ? `<table style="margin:6px 0 0 18px;width:auto"><tr><th>Field</th><th>Addresses outside the allowlist</th></tr>${c.census.map((r) => `<tr><td class="mono">${esc(r.field)}</td><td>${r.non_allowlisted === null ? '<span class="pill fail">unreadable</span> ' + esc(r.note || '') : r.non_allowlisted === 0 ? '<span class="pill ok">0</span>' : '<span class="pill fail">' + r.non_allowlisted + '</span>'}</td></tr>`).join('')}</table>` : ''}</div>`).join('') : '<div class="empty">no development org configured</div>'}
        <div class="muted" style="margin-top:8px">Rerun from a terminal: <span class="mono">sfsmiths agent canary --org &lt;dev alias&gt;</span> — the UI never runs anything against an org.</div></div>`);
    main.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { s.emails.splice(Number(b.dataset.rm), 1); renderSafety(); }));
    const add = () => { const v = $('#sf-new').value.trim(); if (!v) return; if (!/^[A-Za-z0-9*._%+-]+@[A-Za-z0-9*.-]+\.[A-Za-z*]{2,}$|^\*\.[A-Za-z]{2,}$/.test(v)) return toast('Not an address or pattern. Examples: qa@example.com · *@example.com · *.invalid', 'bad'); if (!s.emails.includes(v)) s.emails.push(v); renderSafety(); };
    $('#sf-add').onclick = add; $('#sf-new').addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    main.querySelectorAll('input[name=sf-mode]').forEach((r) => r.addEventListener('change', () => { s.mode = r.value; }));
    $('#sf-census').addEventListener('input', () => { s.census = $('#sf-census').value.split('\n').map((x) => x.trim()).filter(Boolean); });
    $('#sf-save').onclick = async () => {
      try { const r = await api('PUT', 'safety', { allowed_test_emails: s.emails, email_delivery: s.mode, email_census_fields: s.census }); toast(r.note, 'ok'); safetyDraft = null; renderSafety(); } catch (e) { toast(e.message, 'bad'); }
    };
  }

  /* ───────── ORGS ───────── */
  async function renderOrgs(fresh) {
    const d = await api('GET', 'orgs' + (fresh ? '?fresh=1' : ''));
    const kcErr = (k) => d.keychains[k] && d.keychains[k].error;
    setMain(`<h1>Orgs</h1><div class="sub">Default set is 3 (development · preprod · evidence); add as many as you need. <b>Agent keychain</b> = default sf keychain (development read-write + evidence read-only user). <b>Engine keychain</b> = <span class="mono">${esc(d.engine_home)}</span> — preprod lives only here, agents can never reach it.</div>
      ${kcErr('agent') || kcErr('engine') ? `<div class="banner">sf org list failed: ${esc(kcErr('agent') || kcErr('engine'))} — is the Salesforce CLI installed?</div>` : ''}
      <div class="grid g3">${d.status.map((o) => `<div class="card"><h3>${esc(o.role)} · ${esc(o.keychain)} keychain</h3>
          <div class="kpi" style="font-size:20px">${esc(o.alias)} ${o.write ? '<span class="pill LOW">read-write</span>' : '<span class="pill">read-only</span>'}</div>
          <div style="margin:8px 0"><span class="dot ${o.logged_in ? 'ok' : 'bad'}"></span>${o.logged_in ? `logged in as <span class="mono">${esc(o.username)}</span>` : 'not logged in'}${o.leaked_into_other_keychain ? `<div class="pill HIGH" style="margin-top:6px">also present in the other keychain — doctor will fail</div>` : ''}</div>
          ${o.role === 'evidence' ? `<div class="muted">read-only user: <span class="mono">${esc(o.readonly_user || '(not set — set it in config/orgs.yaml)')}</span></div>` : ''}
          ${o.role === 'development' ? `<div class="muted">email deliverability: <b>${esc(o.email_deliverability || 'unknown')}</b>${o.deliverability_verified_on ? ` (verified ${esc(o.deliverability_verified_on)})` : ' — canary enforces it'}</div>` : ''}
          ${o.instance_url_live ? `<div class="muted mono">${esc(o.instance_url_live)}</div>` : ''}
          <div class="row" style="margin-top:12px"><button class="btn primary" data-login="${esc(o.alias)}">${o.logged_in ? 'Re-login' : 'Login'}</button><button class="btn danger right" data-remove="${esc(o.alias)}">Remove</button></div></div>`).join('')}
        <div class="card"><h3>Add an org</h3>
          <label>Alias (as you want it in sf)</label><input id="o-alias" placeholder="e.g. DevSandbox2">
          <label>Role</label><select id="o-role"><option value="development">development (agents write here)</option><option value="preprod">preprod (engine only, baseline source)</option><option value="evidence">evidence (production, read-only user)</option></select>
          <label>Read-only username (evidence role)</label><input id="o-user" placeholder="sfsmiths.readonly@yourcompany.example">
          <label>Instance URL (optional)</label><input id="o-url" placeholder="https://test.salesforce.com">
          <div class="row" style="margin-top:12px"><button class="btn primary right" id="o-add">Add to config</button></div>
          <div class="muted" style="margin-top:8px">Adding writes <span class="mono">config/orgs.yaml</span> and regenerates <span class="mono">.mcp.json</span> + the compiled hook policy. Then Login → Doctor.</div></div>
      </div>
      <div class="row" style="margin-top:14px"><span class="muted">keychain status checked ${esc(ago(d.checked_at))}</span><button class="btn right" id="o-refresh">Refresh status</button></div>`);
    $('#o-refresh').onclick = () => renderOrgs(true);
    $('#o-add').onclick = async () => { try { const r = await api('POST', 'orgs', { alias: $('#o-alias').value, role: $('#o-role').value, readonly_user: $('#o-user').value, instance_url: $('#o-url').value }); toast(r.next, 'ok'); renderOrgs(true); } catch (e) { toast(e.message, 'bad'); } };
    main.querySelectorAll('[data-login]').forEach((b) => b.addEventListener('click', async () => { try { const r = await api('POST', `orgs/${encodeURIComponent(b.dataset.login)}/login`, {}); toast(`${r.command}\n(${r.keychain} keychain, HOME ${r.home})\n${r.note}`, 'ok'); } catch (e) { toast(e.message, 'bad'); } }));
    main.querySelectorAll('[data-remove]').forEach((b) => b.addEventListener('click', async () => { if (!confirm(`Remove ${b.dataset.remove} from config/orgs.yaml? (sf login stays; log out separately)`)) return; try { const r = await api('DELETE', `orgs/${encodeURIComponent(b.dataset.remove)}`); toast(r.note, 'ok'); renderOrgs(true); } catch (e) { toast(e.message, 'bad'); } }));
  }

  /* ───────── LESSONS & REWARDS ───────── */
  async function renderLessons() {
    const [d, t] = await Promise.all([api('GET', 'lessons'), api('GET', 'tokens')]);
    const pending = d.lessons.filter((l) => l.status === 'pending');
    const active = d.lessons.filter((l) => ['approved', 'auto', 'promoted'].includes(l.status));
    const other = d.lessons.filter((l) => ['rejected', 'retired'].includes(l.status));
    const lessonRow = (l, actions) => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${esc(l.title)}</b> ${pill(l.status)} <span class="pill">${esc(l.type)}</span> <span class="muted">sev ${l.severity} · hits ${l.hits}${l.ticket ? ' · ' + esc(l.ticket) : ''} · → ${esc(l.agents.join(', '))}</span></div>
      <div class="muted" style="white-space:pre-wrap;margin-top:4px">${esc(l.body.slice(0, 600))}</div>
      ${l.evidence && l.evidence.length ? `<details><summary>evidence (${l.evidence.length})</summary><div class="mono muted">${l.evidence.map(esc).join('<br>')}</div></details>` : ''}
      ${actions ? `<div class="row" style="margin-top:8px">${actions.map((a) => `<button class="btn ${a === 'approve' || a === 'promote' ? 'ok' : a === 'reject' || a === 'retire' ? 'danger' : ''}" data-decide="${a}" data-id="${esc(l.id)}">${a}</button>`).join('')}</div>` : ''}</div>`;
    const days = Object.entries(t.by_day).sort(); const maxD = Math.max(1, ...days.map(([, v]) => v));
    const tbl = (obj, label) => { const rows = Object.entries(obj).sort((a, b) => b[1].tokens - a[1].tokens); return rows.length ? `<table><tr><th>${label}</th><th>Runs</th><th>Tokens</th><th>In</th><th>Out</th><th>Cache read</th><th>Cost</th></tr>${rows.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${v.runs}</td><td>${fmt(v.tokens)}</td><td>${fmt(v.input)}</td><td>${fmt(v.output)}</td><td>${fmt(v.cache_read)}</td><td>${usd(v.usd)}</td></tr>`).join('')}</table>` : '<div class="empty">no runs yet</div>'; };
    setMain(`<h1>Lessons &amp; rewards</h1><div class="sub">The daily learn run turns the reward ledger into lesson <i>candidates</i>. Nothing reaches an agent until you approve it here (or it clears the auto-promote thresholds you enabled). Approved lessons are regenerated into <span class="mono">.claude/skills/lessons-&lt;agent&gt;/SKILL.md</span>.</div>
      <div class="grid g2">
        <div class="card"><h3>Pending review (${pending.length})</h3>${pending.map((l) => lessonRow(l, ['approve', 'reject'])).join('') || '<div class="empty">Nothing pending. Run <span class="mono">sfsmiths-human learn</span> after tickets finish.</div>'}</div>
        <div class="card"><h3>Active lessons (${active.length})</h3>${active.map((l) => lessonRow(l, l.status === 'promoted' ? ['retire'] : ['promote', 'retire'])).join('') || '<div class="empty">none yet</div>'}
          ${other.length ? `<details style="margin-top:10px"><summary>rejected / retired (${other.length})</summary>${other.map((l) => lessonRow(l)).join('')}</details>` : ''}</div>
      </div>
      <div class="card" style="margin-top:14px"><h3>Reward ledger</h3><div class="row" style="align-items:flex-start"><div style="flex:1">${Object.entries((d.rewards && d.rewards.by_agent) || {}).sort((a, b) => b[1] - a[1]).map(([a, v]) => `<div class="row"><span class="mono" style="width:150px">${esc(a)}</span><b>${v > 0 ? '+' : ''}${v}</b></div>`).join('') || '<span class="muted">no points yet</span>'}</div>
        <div style="flex:1"><div class="muted">by ticket</div>${Object.entries((d.rewards && d.rewards.by_ticket) || {}).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([k, v]) => `<div class="row"><span class="mono" style="width:150px">${esc(k)}</span><b>${v > 0 ? '+' : ''}${v}</b></div>`).join('') || '<span class="muted">–</span>'}</div></div>
        <div class="muted" style="margin-top:8px">Total ${d.rewards ? d.rewards.total : 0} points. Points come only from events (gate results, denials, escalations, human decisions) — never from an agent's self-report. Weights: <span class="mono">config/rewards.yaml</span>.</div></div>
      <div class="card" style="margin-top:14px"><h3>Tokens · last days</h3><div class="sparks">${days.slice(-30).map(([d0, v]) => `<i style="height:${Math.max(3, v / maxD * 100)}%" title="${esc(d0)}: ${fmt(v)}"></i>`).join('') || '<span class="muted">no data</span>'}</div>
        <div class="muted">${t.total_runs} agent runs recorded · ${t.prices_source && t.prices_source !== 'none' ? 'costs from ' + esc(t.prices_source) + ' (metrics/prices.json overrides)' : 'no price table → costs show $0; prices live in config/budgets.yaml → prices'}</div></div>
      <div class="grid g2" style="margin-top:14px"><div class="card"><h3>By model</h3>${tbl(t.by_model, 'Model')}</div><div class="card"><h3>By ticket</h3>${tbl(t.by_ticket, 'Ticket')}</div></div>`);
    main.querySelectorAll('[data-decide]').forEach((b) => b.addEventListener('click', async () => {
      const decision = b.dataset.decide; let reason;
      if (decision === 'reject' || decision === 'retire') { reason = prompt(`Reason to ${decision} (kept as evidence):`); if (!reason) return; }
      try { const r = await api('POST', `lessons/${encodeURIComponent(b.dataset.id)}/decide`, { decision, reason }); toast(`${r.lesson.id} → ${r.lesson.status}. Skills regenerated: ${r.synced.join(', ') || 'none'}`, 'ok'); renderLessons(); } catch (e) { toast(e.message, 'bad'); }
    }));
  }

  /* ───────── CONFIG & DOCTOR ───────── */
  async function renderConfig() {
    const d = await api('GET', 'config');
    const sel = hashParams().get('file') || 'orgs';
    const f = await api('GET', `config/${encodeURIComponent(sel)}`);
    setMain(`<h1>Config &amp; doctor</h1><div class="sub">Every file is validated against its JSON schema before it is written; an invalid save writes nothing. Secrets are never in these files — they come from environment variables: <span class="mono">${d.env_names.map(esc).join(' · ')}</span>.</div>
      <div class="grid" style="grid-template-columns:260px 1fr">
        <div class="card"><h3>Files</h3>${d.files.map((x) => `<div class="row click" style="padding:6px 4px;cursor:pointer;border-radius:6px;${x.name === sel ? 'background:var(--panel2)' : ''}" data-file="${esc(x.name)}"><span class="dot ${x.error ? 'bad' : x.exists ? 'ok' : 'warn'}"></span><span class="mono">${esc(x.name)}.yaml</span><span class="muted right">${x.bytes} B</span></div>`).join('')}
          <h3 style="margin-top:14px">Generated</h3><div class="muted"><span class="dot ${d.generated.mcp_json ? 'ok' : 'bad'}"></span>.mcp.json<br><span class="dot ${d.generated.compiled_policy ? 'ok' : 'bad'}"></span>.sfsmiths/policy.compiled.json<br><span class="dot ${d.generated.settings_json ? 'ok' : 'bad'}"></span>.claude/settings.json<br><span class="dot ${d.generated.agents >= 12 ? 'ok' : 'warn'}"></span>${d.generated.agents} agent files</div>
          <div class="row" style="margin-top:14px"><button class="btn" id="c-sync">Regenerate (sync)</button><button class="btn primary" id="c-doctor">Run doctor</button></div></div>
        <div class="card"><div class="row"><h3 style="margin:0">config/${esc(sel)}.yaml</h3><button class="btn primary right" id="c-save">Validate + save</button></div>
          ${d.files.find((x) => x.name === sel) && d.files.find((x) => x.name === sel).error ? `<div class="banner" style="margin-top:10px">${esc(d.files.find((x) => x.name === sel).error)}</div>` : ''}
          <textarea id="c-yaml" spellcheck="false">${esc(f.yaml)}</textarea>
          <details style="margin-top:8px"><summary>JSON schema</summary><pre>${esc(JSON.stringify(f.schema, null, 2))}</pre></details></div>
      </div>
      <div class="card" style="margin-top:14px" id="doctor-out" hidden><h3>Doctor</h3><div id="doctor-body"></div></div>`);
    main.querySelectorAll('[data-file]').forEach((el) => el.addEventListener('click', () => setHash('config', { file: el.dataset.file })));
    $('#c-save').onclick = async () => { try { const r = await api('PUT', `config/${encodeURIComponent(sel)}`, { yaml: $('#c-yaml').value }); toast(`${r.note}${r.sync.warnings.length ? '\nWarnings: ' + r.sync.warnings.join('; ') : ''}`, 'ok'); } catch (e) { toast(e.message, 'bad'); } };
    $('#c-sync').onclick = async () => { try { const r = await api('POST', 'sync'); toast(`Regenerated. agents: ${r.sync.agents_updated.join(', ') || 'unchanged'} · mcp ${r.sync.mcp_written} · policy ${r.sync.policy_written} · skills ${r.sync.skills.length}${r.sync.warnings.length ? '\n' + r.sync.warnings.join('; ') : ''}`, 'ok'); } catch (e) { toast(e.message, 'bad'); } };
    $('#c-doctor').onclick = async () => {
      const out = $('#doctor-out'); out.hidden = false; $('#doctor-body').innerHTML = '<div class="muted">running (quick mode: no live org calls beyond keychain listing)…</div>';
      try { const r = await api('POST', 'doctor', { quick: true }); $('#doctor-body').innerHTML = `<div class="row" style="margin-bottom:8px">${r.ok ? '<span class="pill ok">OK</span>' : '<span class="pill fail">PROBLEMS</span>'} <span class="muted">${esc(r.at)} · full run: <span class="mono">sfsmiths-human doctor</span></span></div><table>${r.checks.map((c) => `<tr><td>${pill(c.level)}</td><td><b>${esc(c.title)}</b><div class="muted" style="white-space:pre-wrap">${esc(c.detail)}</div></td></tr>`).join('')}</table>`; } catch (e) { $('#doctor-body').innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
    };
  }

  /* ───────── shell ───────── */
  const VIEWS = { dashboard: renderDashboard, tickets: renderTickets, agents: renderAgents, orgs: renderOrgs, safety: renderSafety, lessons: renderLessons, config: renderConfig };
  async function render() {
    if (!TOKEN) return setMain('<div class="banner">No token in the URL. Start the UI with <span class="mono">sfsmiths-human ui</span> and open the exact URL it prints (the part after # is the token).</div>');
    const v = VIEWS[view()] ? view() : 'dashboard';
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.v === v));
    try { await VIEWS[v](); } catch (e) { fail(e); if (/token/i.test(e.message)) TOKEN = ''; }
    $('#foot-ts').textContent = 'refreshed ' + new Date().toLocaleTimeString();
  }
  document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => setHash(b.dataset.v)));
  window.addEventListener('hashchange', () => { const t = hashParams().get('t'); if (t) TOKEN = t; render(); });
  render();
  setInterval(() => { if (view() === 'dashboard' && $('#modal').style.display !== 'grid') render(); }, 20000);
})();
</script>
</body>
</html>
